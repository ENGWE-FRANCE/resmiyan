<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réserver une table | MIYAN</title>
<meta name="description" content="Réservez votre table chez MIYAN, 62 rue du Faubourg Montmartre, Paris 9e.">
<meta name="theme-color" content="#2a0708">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;900&family=Shippori+Antique&display=swap" rel="stylesheet">
<style>
  :root { --bdx:#520D10; --deep:#2a0708; --cream:#F4E5C4; --gold:#C49A3A; --paper:#FBF3DF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--deep); color:var(--bdx); font-family:"Work Sans",system-ui,sans-serif; line-height:1.45; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; align-items:center; justify-content:space-between; color:var(--cream); padding:6px 2px 22px; }
  .logo { text-decoration:none; font-weight:900; letter-spacing:.12em; font-size:20px; }
  .logo span { font-family:"Shippori Antique",serif; font-weight:400; margin-right:8px; letter-spacing:.05em; }
  .lang button { background:none; border:1px solid transparent; color:var(--cream); font:inherit; font-weight:600; padding:4px 9px; border-radius:999px; cursor:pointer; opacity:.6; }
  .lang button[aria-pressed="true"] { opacity:1; border-color:var(--gold); }
  .card { background:var(--cream); border-radius:18px; padding:24px 20px 26px; box-shadow:0 0 0 1px var(--gold) inset; }
  h1 { font-weight:900; font-size:30px; line-height:1.05; margin:0 0 6px; text-transform:uppercase; letter-spacing:.01em; }
  .sub { margin:0 0 22px; font-size:15px; }
  h2 { font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.12em; margin:24px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 i { font-style:normal; background:var(--bdx); color:var(--cream); width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  .scroll { flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; margin:0 -20px; padding-left:20px; padding-right:20px; scrollbar-width:thin; }
  .chip { flex:0 0 auto; background:var(--paper); border:1.5px solid rgba(82,13,16,.25); color:var(--bdx); font:inherit; font-weight:600; border-radius:12px; padding:10px 14px; min-width:48px; min-height:46px; cursor:pointer; text-align:center; }
  .chip small { display:block; font-weight:400; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .chip:hover:not(:disabled) { border-color:var(--bdx); }
  .chip[aria-pressed="true"] { background:var(--bdx); color:var(--cream); border-color:var(--bdx); }
  .chip:disabled { opacity:.35; cursor:not-allowed; text-decoration:line-through; }
  .chip:focus-visible, input:focus-visible, textarea:focus-visible, .btn:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .other { margin-top:10px; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .svc { font-size:12px; text-transform:uppercase; letter-spacing:.1em; margin:12px 0 8px; opacity:.75; }
  .hint { font-size:14px; opacity:.8; margin:6px 0 0; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], textarea {
    width:100%; font:inherit; font-size:16px; color:var(--bdx); background:var(--paper); border:1.5px solid rgba(82,13,16,.25); border-radius:12px; padding:12px 13px; }
  input[type=date] { width:auto; padding:8px 10px; }
  textarea { min-height:70px; resize:vertical; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  @media (max-width:440px) { .two { grid-template-columns:1fr; } h1 { font-size:26px; } }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .btn { width:100%; margin-top:20px; background:var(--bdx); color:var(--cream); border:0; border-radius:999px; font:inherit; font-weight:900; text-transform:uppercase; letter-spacing:.08em; padding:16px; font-size:16px; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .recap { background:var(--paper); border-left:4px solid var(--gold); border-radius:8px; padding:10px 12px; margin-top:18px; font-weight:600; }
  .err { color:#a3000b; font-weight:600; font-size:14px; margin-top:12px; min-height:1em; }
  .legal { font-size:12px; opacity:.75; margin-top:12px; }
  .done { text-align:center; padding:12px 0; }
  .done .big { font-family:"Shippori Antique",serif; font-size:44px; margin:0; }
  .done p { margin:10px 0; }
  .demo { background:var(--gold); color:var(--deep); font-size:13px; font-weight:600; padding:8px 12px; border-radius:10px; margin-bottom:14px; }
  footer { color:var(--cream); opacity:.7; font-size:13px; text-align:center; margin-top:22px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="https://miyan.fr/"><span>米安</span>MIYAN</a>
    <div class="lang" role="group" aria-label="Langue">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="card">
    <div class="demo" id="demo" hidden>Mode démonstration : la page n'est pas encore reliée au Google Sheet (API_URL à renseigner).</div>

    <form id="form" novalidate>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>

      <h2><i>1</i><span data-t="s1"></span></h2>
      <div class="row" id="party"></div>
      <p class="hint" id="groupHint"></p>

      <h2><i>2</i><span data-t="s2"></span></h2>
      <div class="row scroll" id="days"></div>
      <div class="other"><label for="otherDate" style="margin:0" data-t="other"></label><input type="date" id="otherDate"></div>

      <h2><i>3</i><span data-t="s3"></span></h2>
      <div id="slots" aria-live="polite"></div>

      <h2><i>4</i><span data-t="s4"></span></h2>
      <label for="name" data-t="name"></label>
      <input type="text" id="name" autocomplete="name" maxlength="80" required>
      <div class="two">
        <div><label for="phone" data-t="phone"></label><input type="tel" id="phone" autocomplete="tel" maxlength="20" required></div>
        <div><label for="email" data-t="email"></label><input type="email" id="email" autocomplete="email" maxlength="120" required></div>
      </div>
      <label for="note" data-t="note"></label>
      <textarea id="note" maxlength="300"></textarea>
      <div class="hp" aria-hidden="true"><label>Website<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>

      <div class="recap" id="recap" hidden></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit" id="submit" data-t="submit"></button>
      <p class="legal" data-t="legal"></p>
    </form>

    <div class="done" id="done" hidden>
      <p class="big">谢谢</p>
      <h1 data-t="doneTitle"></h1>
      <div class="recap" id="doneRecap"></div>
      <p data-t="doneMail"></p>
      <p><a href="https://miyan.fr/" data-t="back"></a></p>
    </div>
  </main>

  <footer>62 rue du Faubourg Montmartre, 75009 Paris</footer>
</div>

<script>
/* ═══ À RENSEIGNER : l'URL de l'application Web Google Apps Script (se termine par /exec) ═══ */
const API_URL = 'COLLER_ICI_URL_APPS_SCRIPT';
/* ═════════════════════════════════════════════════════════════════════════════════════════ */

const DEMO = !/^https:\/\/script\.google\.com\//.test(API_URL);
const T = {
  fr: { title:'Réserver une table', sub:'Confirmation immédiate par email.', s1:'Combien de personnes ?', s2:'Quel jour ?', s3:'À quelle heure ?', s4:'Vos coordonnées',
    other:'Autre date :', name:'Nom et prénom', phone:'Téléphone', email:'Email', note:'Une demande particulière ? (facultatif)', submit:'Confirmer la réservation',
    legal:'Vos coordonnées servent uniquement à gérer votre réservation. Pour toute demande : contact@miyan.fr.',
    midi:'Midi', soir:'Soir', pick:'Choisissez un jour pour voir les horaires.', loading:'Recherche des disponibilités…', closed:'Pas de réservation possible ce jour-là. Essayez une autre date.',
    none:'Complet ce jour-là. Essayez une autre date ou venez sans réservation.', group:n=>`Plus de ${n} personnes ? Écrivez-nous à `, pers:n=>n>1?`${n} personnes`:'1 personne', at:'à',
    eSlot:'Choisissez un jour et un horaire.', eName:'Indiquez votre nom.', ePhone:'Indiquez un numéro de téléphone valide.', eEmail:'Indiquez une adresse email valide.',
    eFull:'Ce créneau vient d\'être pris. Choisissez-en un autre.', eNet:'Impossible d\'enregistrer la réservation. Réessayez dans un instant.', sending:'Envoi…',
    doneTitle:'C\'est réservé', doneMail:'Un email de confirmation vient de vous être envoyé. Il contient un lien pour annuler si besoin.', back:'Retour au site', ref:'Référence' },
  en: { title:'Book a table', sub:'Instant confirmation by email.', s1:'How many guests?', s2:'Which day?', s3:'What time?', s4:'Your details',
    other:'Another date:', name:'Full name', phone:'Phone', email:'Email', note:'Any special request? (optional)', submit:'Confirm booking',
    legal:'Your details are only used to manage your booking. Any question: contact@miyan.fr.',
    midi:'Lunch', soir:'Dinner', pick:'Pick a day to see available times.', loading:'Checking availability…', closed:'No bookings available that day. Please try another date.',
    none:'Fully booked that day. Try another date or just walk in.', group:n=>`More than ${n} guests? Email us at `, pers:n=>n>1?`${n} guests`:'1 guest', at:'at',
    eSlot:'Please pick a day and a time.', eName:'Please enter your name.', ePhone:'Please enter a valid phone number.', eEmail:'Please enter a valid email address.',
    eFull:'That time was just taken. Please pick another one.', eNet:'We could not save your booking. Please try again in a moment.', sending:'Sending…',
    doneTitle:'You\'re booked', doneMail:'A confirmation email is on its way. It includes a link to cancel if needed.', back:'Back to the website', ref:'Reference' }
};

const st = { lang:(navigator.language||'fr').toLowerCase().startsWith('fr')?'fr':'en', party:2, date:null, time:null, slots:null, loading:false,
             cfg:{ maxParty:8, maxDays:30, phone:'', email:'contact@miyan.fr' } };
const $ = id => document.getElementById(id);
const t = k => T[st.lang][k];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const plus = n => { const d=today(); d.setDate(d.getDate()+n); return d; };
const longDate = s => new Intl.DateTimeFormat(st.lang==='fr'?'fr-FR':'en-GB',{weekday:'long',day:'numeric',month:'long'}).format(fromIso(s));
const el = (tag, attrs, text) => { const e=document.createElement(tag); Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v)); if(text!=null) e.textContent=text; return e; };

function renderTexts() {
  document.documentElement.lang = st.lang;
  document.title = t('title') + ' | MIYAN';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===st.lang));
  const g = $('groupHint'); g.textContent = T[st.lang].group(st.cfg.maxParty);
  g.append(el('a',{href:'mailto:'+st.cfg.email}, st.cfg.email));
}

function renderParty() {
  const box = $('party'); box.textContent='';
  for (let n=1; n<=st.cfg.maxParty; n++) {
    const b = el('button',{type:'button',class:'chip','aria-pressed':n===st.party}, n);
    b.onclick = () => { st.party=n; renderParty(); loadSlots(); };
    box.append(b);
  }
}

function renderDays() {
  const box = $('days'); box.textContent='';
  const loc = st.lang==='fr'?'fr-FR':'en-GB';
  for (let i=0; i<Math.min(14, st.cfg.maxDays+1); i++) {
    const d = plus(i), s = iso(d);
    const b = el('button',{type:'button',class:'chip','aria-pressed':s===st.date,'aria-label':longDate(s)});
    b.append(el('small',null,new Intl.DateTimeFormat(loc,{weekday:'short'}).format(d)), document.createTextNode(d.getDate()+' '), el('small',null,new Intl.DateTimeFormat(loc,{month:'short'}).format(d)));
    b.onclick = () => pickDate(s);
    box.append(b);
  }
  const o = $('otherDate'); o.min = iso(today()); o.max = iso(plus(st.cfg.maxDays)); o.value = st.date || '';
}

function pickDate(s) { st.date=s; st.time=null; renderDays(); loadSlots(); }

function renderSlots() {
  const box = $('slots'); box.textContent='';
  const msg = k => box.append(el('p',{class:'hint'},t(k)));
  if (!st.date) return msg('pick');
  if (st.loading) return msg('loading');
  if (!st.slots || !st.slots.length) return msg('closed');
  if (!st.slots.some(s=>s.available)) return msg('none');
  ['midi','soir'].forEach(svc => {
    const list = st.slots.filter(s=>s.service===svc);
    if (!list.length) return;
    box.append(el('div',{class:'svc'},t(svc)));
    const row = el('div',{class:'row'});
    list.forEach(s => {
      const b = el('button',{type:'button',class:'chip','aria-pressed':s.time===st.time}, s.time);
      b.disabled = !s.available;
      b.onclick = () => { st.time=s.time; renderSlots(); renderRecap(); };
      row.append(b);
    });
    box.append(row);
  });
}

function recapText() { return `${longDate(st.date)} ${t('at')} ${st.time} · ${T[st.lang].pers(st.party)}`; }
function renderRecap() { const r=$('recap'); r.hidden = !(st.date&&st.time); if(!r.hidden) r.textContent = recapText(); }

let reqId = 0;
async function loadSlots() {
  $('err').textContent=''; renderRecap();
  if (!st.date) return renderSlots();
  const mine = ++reqId; st.loading=true; renderSlots();
  let res;
  try { res = await api('GET', {action:'slots', date:st.date, party:st.party}); } catch(e) { res = {ok:false}; }
  if (mine !== reqId) return;
  st.loading=false; st.slots = res.ok ? res.slots : [];
  if (res.config) applyCfg(res.config);
  if (!st.slots.some(s=>s.time===st.time && s.available)) st.time=null;
  renderSlots(); renderRecap();
}

function applyCfg(c) {
  const changed = c.maxParty!==st.cfg.maxParty || c.maxDays!==st.cfg.maxDays;
  Object.assign(st.cfg, c); if (!st.cfg.email) st.cfg.email='contact@miyan.fr';
  if (st.party>st.cfg.maxParty) st.party=st.cfg.maxParty;
  if (changed) { renderParty(); renderDays(); renderTexts(); }
}

async function api(method, data) {
  if (DEMO) return demoApi(method, data);
  if (method==='GET') return (await fetch(API_URL+'?'+new URLSearchParams(data))).json();
  // text/plain évite la pré-requête CORS, non gérée par Apps Script
  return (await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})).json();
}
function demoApi(method, data) {
  return new Promise(r => setTimeout(() => {
    if (method==='POST') return r({ok:true,id:'MY-DEMO01'});
    const slots=[]; const add=(svc,a,z)=>{ for(let m=a;m<=z;m+=15) slots.push({time:pad(Math.floor(m/60))+':'+pad(m%60),service:svc,available:(m/15)%5!==0}); };
    add('midi',720,840); add('soir',1140,1320); r({ok:true,slots,config:st.cfg});
  }, 350));
}

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('err'), btn = $('submit');
  const name=$('name').value.trim(), phone=$('phone').value.trim(), email=$('email').value.trim();
  const fail = (k, id) => { err.textContent=t(k); if(id) $(id).focus(); };
  if (!st.date || !st.time) return fail('eSlot');
  if (!name) return fail('eName','name');
  if (phone.replace(/\D/g,'').length < 8) return fail('ePhone','phone');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('eEmail','email');
  err.textContent=''; btn.disabled=true; btn.textContent=t('sending');
  let res;
  try { res = await api('POST',{date:st.date,time:st.time,party:st.party,name,phone,email,note:$('note').value.trim(),lang:st.lang,website:$('website').value}); }
  catch(e) { res={ok:false}; }
  btn.disabled=false; btn.textContent=t('submit');
  if (res.ok) {
    $('doneRecap').textContent = recapText() + (res.id && res.id!=='OK' ? ` · ${t('ref')} ${res.id}` : '');
    $('form').hidden=true; $('done').hidden=false; window.scrollTo({top:0});
  } else if (res.error==='full') { err.textContent=t('eFull'); loadSlots(); }
  else err.textContent=t('eNet');
});

$('otherDate').addEventListener('change', e => { if (e.target.value) pickDate(e.target.value); });
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { st.lang=b.dataset.lang; renderTexts(); renderDays(); renderSlots(); renderRecap(); });

$('demo').hidden = !DEMO;
renderTexts(); renderParty(); renderDays(); renderSlots();
if (!DEMO) api('GET',{}).then(r => r && r.config && applyCfg(r.config)).catch(()=>{});
</script>
</body>
</html>
